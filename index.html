<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SKEBOB</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      touch-action: none;
    }
    canvas#webgl {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }
    /* Minimal HUD */
    .hud {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      color: #ffffff;
      pointer-events: none;
    }
    .hud h1 {
      font-size: 13px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-weight: 800;
    }
    .hud p {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #777777;
      margin-top: 4px;
      line-height: 1.5;
    }
    /* Formation Mode Badge */
    .mode-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 999px;
      color: #ffffff;
      font-family: monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .mode-badge:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.4);
    }
    /* Return Button */
    .back-btn {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 20;
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 12px 26px;
      border-radius: 999px;
      font-family: monospace;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.45);
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  background 0.2s;
    }
    .back-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    .back-btn:hover {
      background: #e0e0e0;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div class="hud">
    <h1>SKEBOB</h1>
    <p>WASD / Drag flight &bull; [Space / M] Morph Formation &bull; Tap image twice to 3D flip</p>
  </div>
  <div class="mode-badge" id="modeBtn">MODE: DOME MATRIX</div>
  <button class="back-btn" id="backBtn">&larr; Return to Warp</button>
  <canvas id="webgl"></canvas>

  <script>
    // --- Three.js & Engine Setup ---
    const canvas = document.querySelector('#webgl');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1500);
    camera.position.set(0, -6, 32);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Shared Shader Uniforms
    const uniforms = {
      uTime: { value: 0.0 },
      uWaveHeight: { value: 1.8 },
      uWaveFreq: { value: 0.14 },
      uFocusIndex: { value: -1.0 },
      uFlattenProgress: { value: 0.0 },
      uDomeStrength: { value: 1.0 }, // Morph between Dome (1.0) and Flat/Helix (0.0)
      uMouseWorld: { value: new THREE.Vector2(9999.0, 9999.0) },
      uMouseStrength: { value: 0.0 },
      uShockOrigin: { value: new THREE.Vector2(0.0, 0.0) },
      uShockTime: { value: -100.0 }
    };

    // Shared GLSL: IMAX Curvature + Waves + Expanding Circular Shockwave
    const sharedGLSL = `
      uniform float uTime;
      uniform float uWaveHeight;
      uniform float uWaveFreq;
      uniform float uDomeStrength;
      uniform vec2 uMouseWorld;
      uniform float uMouseStrength;
      uniform vec2 uShockOrigin;
      uniform float uShockTime;

      float getDome(vec2 pos) {
        float r2 = dot(pos, pos);
        float R = 190.0;
        float R2 = R * R;
        float d = R - sqrt(max(R2 - min(r2, R2 - 1.0), 0.0));
        return d * uDomeStrength;
      }

      float getWave(vec2 pos) {
        float w1 = sin(pos.x * uWaveFreq + uTime * 0.75) * cos(pos.y * uWaveFreq * 0.8 + uTime * 0.55);
        float w2 = sin((pos.x + pos.y) * uWaveFreq * 0.6 + uTime * 0.4) * 0.5;
        float base = (w1 + w2) * uWaveHeight;

        // Mouse wake ripple
        float d = distance(pos, uMouseWorld);
        float ripple = sin(d * 1.7 - uTime * 5.5) * exp(-d * 0.35) * 1.8 * uMouseStrength;

        // Circular Shockwave
        float shockWave = 0.0;
        if (uShockTime >= 0.0 && uShockTime < 3.5) {
          float distShock = distance(pos, uShockOrigin);
          float front = uShockTime * 90.0;
          float diff = abs(distShock - front);
          float ring = smoothstep(14.0, 0.0, diff);
          shockWave = sin(diff * 0.5) * ring * exp(-uShockTime * 1.2) * 5.0;
        }

        return base + ripple + shockWave;
      }
    `;

    function getDomeZ(x, y) {
      const r2 = x * x + y * y;
      const R = 190.0;
      return (R - Math.sqrt(Math.max(R * R - Math.min(r2, R * R - 1), 0))) * uniforms.uDomeStrength.value;
    }

    // --- 1. IMAX Curved Grid ---
    const gridGeo = new THREE.PlaneGeometry(300, 300, 220, 220);
    const gridMat = new THREE.ShaderMaterial({
      uniforms: uniforms,
      vertexShader: `
        ${sharedGLSL}
        varying vec3 vWorldPos;
        void main() {
          vec3 pos = position;
          pos.z += getDome(pos.xy) + getWave(pos.xy);
          vWorldPos = pos;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
      `,
      fragmentShader: `
        varying vec3 vWorldPos;
        void main() {
          vec2 grid = abs(fract(vWorldPos.xy * 0.35 - 0.5) - 0.5) / fwidth(vWorldPos.xy * 0.35);
          float line = min(grid.x, grid.y);
          float c = 1.0 - min(line, 1.0);

          float dist = length(vWorldPos.xy);
          float alpha = smoothstep(145.0, 35.0, dist) * c * 0.55;
          gl_FragColor = vec4(vec3(1.0), alpha);
        }
      `,
      transparent: true
    });
    const gridMesh = new THREE.Mesh(gridGeo, gridMat);
    scene.add(gridMesh);

    // --- 2. Floating Cosmic Particles ---
    const particleCount = 2000;
    const particleGeo = new THREE.BufferGeometry();
    const particlePos = new Float32Array(particleCount * 3);
    const particleSizes = new Float32Array(particleCount);
    const particleSeeds = new Float32Array(particleCount);

    for (let i = 0; i < particleCount; i++) {
      particlePos[i * 3 + 0] = (Math.random() - 0.5) * 260;
      particlePos[i * 3 + 1] = (Math.random() - 0.5) * 260;
      particlePos[i * 3 + 2] = (Math.random() - 0.25) * 40;
      particleSizes[i] = Math.random() * 22.0 + 8.0;
      particleSeeds[i] = Math.random() * 100.0;
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
    particleGeo.setAttribute('aSize', new THREE.BufferAttribute(particleSizes, 1));
    particleGeo.setAttribute('aSeed', new THREE.BufferAttribute(particleSeeds, 1));

    function createParticleTexture() {
      const cvs = document.createElement('canvas');
      cvs.width = 64;
      cvs.height = 64;
      const ctx = cvs.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.3, 'rgba(255,255,255,0.7)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(cvs);
    }

    const particleMat = new THREE.ShaderMaterial({
      uniforms: {
        ...uniforms,
        uTexture: { value: createParticleTexture() },
        uSpeedWarp: { value: 0.0 }
      },
      vertexShader: `
        ${sharedGLSL}
        uniform float uSpeedWarp;
        attribute float aSize;
        attribute float aSeed;
        varying float vAlpha;

        void main() {
          vec3 pos = position;
          pos.z += getDome(pos.xy) + getWave(pos.xy) * 0.4;
          pos.z += sin(uTime * 0.8 + aSeed) * 0.8;
          pos.x += cos(uTime * 0.4 + aSeed) * 0.5;

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          gl_Position = projectionMatrix * mvPosition;

          float twinkle = sin(uTime * 2.0 + aSeed) * 0.35 + 0.65;
          gl_PointSize = (aSize * twinkle * (1.0 + uSpeedWarp * 0.85)) * (15.0 / -mvPosition.z);
          vAlpha = smoothstep(120.0, 5.0, -mvPosition.z) * 0.75;
        }
      `,
      fragmentShader: `
        uniform sampler2D uTexture;
        varying float vAlpha;
        void main() {
          vec4 tex = texture2D(uTexture, gl_PointCoord);
          gl_FragColor = vec4(tex.rgb, tex.a * vAlpha);
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const particleSystem = new THREE.Points(particleGeo, particleMat);
    scene.add(particleSystem);

    // --- 3. Textures: Multiline Typography & Card Back ---
    function makeTextTexture(title, desc) {
      const cvs = document.createElement('canvas');
      cvs.width = 1024;
      cvs.height = 420;
      const ctx = cvs.getContext('2d');
      ctx.clearRect(0, 0, cvs.width, cvs.height);

      ctx.fillStyle = "#ffffff";
      ctx.font = "900 44px monospace";
      ctx.textAlign = "center";
      ctx.fillText(title.toUpperCase(), 512, 65);

      // Multiline wrapping for descriptions
      ctx.fillStyle = "#a2a2ab";
      ctx.font = "500 25px monospace";
      ctx.textAlign = "center";
      
      const words = (desc || "").split(' ');
      const maxWidth = 880;
      const lineHeight = 36;
      let line = '';
      let y = 125;

      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
          ctx.fillText(line.trim(), 512, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      if (line.trim().length > 0) ctx.fillText(line.trim(), 512, y);

      const tex = new THREE.CanvasTexture(cvs);
      tex.needsUpdate = true;
      return tex;
    }

    // Collectible Card Back Canvas Texture (Gray/White gradient, reflections, title)
    function makeCardBackTexture(title) {
      const cvs = document.createElement('canvas');
      cvs.width = 1024;
      cvs.height = 1024;
      const ctx = cvs.getContext('2d');

      // Brushed titanium diagonal gradient
      const grad = ctx.createLinearGradient(0, 0, 1024, 1024);
      grad.addColorStop(0, '#121215');
      grad.addColorStop(0.3, '#2c2c34');
      grad.addColorStop(0.5, '#484855');
      grad.addColorStop(0.7, '#24242a');
      grad.addColorStop(1, '#0e0e11');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 1024);

      // Luxury card frames
      ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
      ctx.lineWidth = 4;
      ctx.strokeRect(60, 60, 904, 904);

      ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
      ctx.lineWidth = 2;
      ctx.strokeRect(75, 75, 874, 874);

      // Minimalist crest
      ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(512, 430, 110, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(512, 290);
      ctx.lineTo(512, 570);
      ctx.moveTo(372, 430);
      ctx.lineTo(652, 430);
      ctx.stroke();

      // Card Back Typography
      ctx.fillStyle = "#ffffff";
      ctx.font = "800 34px monospace";
      ctx.textAlign = "center";
      ctx.fillText("SKEBOB ARCHIVE", 512, 610);

      ctx.fillStyle = "#f0f0f5";
      ctx.font = "900 48px monospace";
      ctx.fillText((title || "ARTIFACT").toUpperCase(), 512, 685);

      ctx.fillStyle = "#777782";
      ctx.font = "600 24px monospace";
      ctx.fillText("AUTHENTIC COLLECTIBLE", 512, 750);

      const tex = new THREE.CanvasTexture(cvs);
      tex.needsUpdate = true;
      return tex;
    }

    // --- 4. Morphing Formation Coordinates ---
    let currentMode = 0; // 0: Dome, 1: Helix, 2: Saturn Ring
    const MODES = ["DOME MATRIX", "DNA HELIX", "SATURN RING"];
    const modeBtn = document.getElementById('modeBtn');

    function calculateFormations(count) {
      const formations = { dome: [], helix: [], ring: [] };

      // 1. Dome Organic Positions
      formations.dome.push({ x: 0, y: 0, z: 0, scale: 2.4 });
      let currentRadius = 16.0;
      let angle = 0;
      for (let i = 1; i < count; i++) {
        let placed = false, attempts = 0;
        while (!placed && attempts < 200) {
          attempts++;
          angle += 0.85 + (Math.random() * 0.25);
          currentRadius += 0.55;
          const jitter = (Math.random() - 0.5) * 4.0;
          const x = Math.cos(angle) * (currentRadius + jitter);
          const y = Math.sin(angle) * (currentRadius + jitter);
          if (!formations.dome.some(p => Math.hypot(p.x - x, p.y - y) < 14.5)) {
            formations.dome.push({ x, y, z: 0, scale: 0.95 + Math.random() * 0.45 });
            placed = true;
          }
        }
      }

      // 2. DNA Double Helix
      for (let i = 0; i < count; i++) {
        const strand = (i % 2 === 0) ? 0 : Math.PI;
        const theta = (i * 0.45) + strand;
        const r = 20.0;
        const x = Math.cos(theta) * r;
        const y = Math.sin(theta) * r;
        const z = ((i - count * 0.5) * 3.6);
        formations.helix.push({ x, y, z, scale: 1.1 });
      }

      // 3. Saturn Orbital Ring
      for (let i = 0; i < count; i++) {
        const track = i % 4;
        const r = 32.0 + track * 8.5;
        const theta = (i / count) * Math.PI * 2 + (track * 0.35);
        const x = Math.cos(theta) * r;
        const y = Math.sin(theta) * r * 0.65; // Elliptical ring
        const z = (Math.random() - 0.5) * 4.0;
        formations.ring.push({ x, y, z, scale: 1.15 });
      }

      return formations;
    }

    // --- 5. Gallery Initialization ---
    const interactiveObjects = [];
    const cardMeshList = [];
    const cardData = [];
    const cardGroup = new THREE.Group();
    scene.add(cardGroup);

    const texLoader = new THREE.TextureLoader();
    let formationData = null;

    fetch('list.json')
      .then(res => res.json())
      .then(data => initGallery(data))
      .catch(err => console.error("Error loading list.json:", err));

    function initGallery(items) {
      let heroIndex = items.findIndex(item => item.src.includes('original-skebob.jpg'));
      if (heroIndex > -1) {
        const [hero] = items.splice(heroIndex, 1);
        items.unshift(hero);
      }

      formationData = calculateFormations(items.length);

      items.forEach((item, index) => {
        const dPos = formationData.dome[index];
        const baseW = 5.2 * dPos.scale;
        const baseH = 5.2 * dPos.scale;

        const cardGeo = new THREE.PlaneGeometry(baseW, baseH, 32, 32);
        const texture = texLoader.load(item.src);
        const backTexture = makeCardBackTexture(item.title);

        const cardMat = new THREE.ShaderMaterial({
          uniforms: {
            ...uniforms,
            uTexture: { value: texture },
            uBackTexture: { value: backTexture },
            uIndex: { value: index }
          },
          vertexShader: `
            ${sharedGLSL}
            uniform float uIndex;
            uniform float uFocusIndex;
            uniform float uFlattenProgress;
            varying vec2 vUv;

            void main() {
              vUv = uv;
              vec3 pos = position;
              vec4 worldPos = modelMatrix * vec4(pos, 1.0);

              float domeZ = getDome(worldPos.xy);
              float waveZ = getWave(worldPos.xy);

              if (abs(uIndex - uFocusIndex) < 0.1) {
                waveZ = mix(waveZ, 0.0, uFlattenProgress);
                worldPos.z += uFlattenProgress * 4.5;
              }

              worldPos.z += domeZ + waveZ + 0.12;
              gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
          `,
          fragmentShader: `
            ${sharedGLSL}
            uniform sampler2D uTexture;
            uniform sampler2D uBackTexture;
            varying vec2 vUv;

            void main() {
              // Anti-aliased thin border line along perimeter
              float edgeDist = min(min(vUv.x, 1.0 - vUv.x), min(vUv.y, 1.0 - vUv.y));
              float borderLine = 1.0 - smoothstep(0.008, 0.02, edgeDist);

              // Corner Line Gradient: Top-Right (1,1) and Bottom-Left (0,0)
              float dTR = distance(vUv, vec2(1.0, 1.0));
              float dBL = distance(vUv, vec2(0.0, 0.0));
              float cornerFade = smoothstep(0.35, 0.02, dTR) + smoothstep(0.35, 0.02, dBL);
              float activeBorder = borderLine * cornerFade;

              // Front vs Back rendering
              if (!gl_FrontFacing) {
                vec4 bTex = texture2D(uBackTexture, vec2(1.0 - vUv.x, vUv.y));
                float shimmer = pow(max(0.0, sin((vUv.x + vUv.y) * 5.0 + uTime * 2.5)), 8.0) * 0.35;
                vec3 col = bTex.rgb + vec3(shimmer) + vec3(1.0) * activeBorder;
                gl_FragColor = vec4(col, 1.0);
              } else {
                vec4 fTex = texture2D(uTexture, vUv);
                vec3 col = mix(fTex.rgb, vec3(1.0), activeBorder);

                // Feathered borderless edge
                float alphaEdge = smoothstep(0.0, 0.025, vUv.x) * smoothstep(1.0, 0.975, vUv.x) *
                                  smoothstep(0.0, 0.025, vUv.y) * smoothstep(1.0, 0.975, vUv.y);
                gl_FragColor = vec4(col, clamp(alphaEdge + activeBorder, 0.0, 1.0));
              }
            }
          `,
          transparent: true,
          side: THREE.DoubleSide
        });

        const cardMesh = new THREE.Mesh(cardGeo, cardMat);
        cardMesh.position.set(dPos.x, dPos.y, dPos.z);
        cardMesh.userData = {
          index,
          item,
          scale: dPos.scale,
          baseRotX: 0,
          baseRotY: 0,
          baseRotZ: 0,
          targetRotX: 0,
          targetRotY: 0,
          flipAngle: 0,
          isFlipped: false,
          currentPos: new THREE.Vector3(dPos.x, dPos.y, dPos.z),
          targetPos: new THREE.Vector3(dPos.x, dPos.y, dPos.z)
        };
        cardGroup.add(cardMesh);
        interactiveObjects.push(cardMesh);
        cardMeshList.push(cardMesh);

        // Subtitle Mesh
        const textH = 1.7 * dPos.scale;
        const textGeo = new THREE.PlaneGeometry(baseW * 1.35, textH, 24, 8);
        const textTex = makeTextTexture(item.title || "Skebob", item.description || "");

        const textMat = new THREE.ShaderMaterial({
          uniforms: {
            ...uniforms,
            uTexture: { value: textTex },
            uIndex: { value: index }
          },
          vertexShader: `
            ${sharedGLSL}
            uniform float uIndex;
            uniform float uFocusIndex;
            uniform float uFlattenProgress;
            varying vec2 vUv;

            void main() {
              vUv = uv;
              vec3 pos = position;
              vec4 worldPos = modelMatrix * vec4(pos, 1.0);

              float domeZ = getDome(worldPos.xy);
              float waveZ = getWave(worldPos.xy);

              if (abs(uIndex - uFocusIndex) < 0.1) {
                waveZ = mix(waveZ, 0.0, uFlattenProgress);
                worldPos.z += uFlattenProgress * 4.5;
              }

              // Forward bias (+0.35) prevents any wave occlusion
              worldPos.z += domeZ + waveZ + 0.35;
              gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
          `,
          fragmentShader: `
            uniform sampler2D uTexture;
            varying vec2 vUv;
            void main() {
              gl_FragColor = texture2D(uTexture, vUv);
            }
          `,
          transparent: true,
          side: THREE.DoubleSide
        });

        const textMesh = new THREE.Mesh(textGeo, textMat);
        const yOffset = -(baseH * 0.5 + textH * 0.65);
        textMesh.position.set(dPos.x, dPos.y + yOffset, dPos.z);
        textMesh.userData = {
          index,
          yOffset,
          targetPos: new THREE.Vector3(dPos.x, dPos.y + yOffset, dPos.z)
        };
        cardGroup.add(textMesh);
        interactiveObjects.push(textMesh);

        cardData.push({ x: dPos.x, y: dPos.y, z: dPos.z, scale: dPos.scale, mesh: cardMesh, textMesh });
      });
    }

    // --- 6. Controls, Flight, Shockwaves & Flip Rig ---
    let isDragging = false;
    let dragStartPos = { x: 0, y: 0 };
    let prevPointer = { x: 0, y: 0 };
    let targetPan = { x: 0, y: 0 };
    let panOffset = { x: 0, y: 0 };

    // Expanded Zoom Range: 4.0 (macro close) to 190.0 (galaxy-wide)
    let targetZoom = 32.0;
    let zoom = 32.0;
    let initialPinchDist = null;

    let focusedIndex = -1;
    let focusProgress = 0.0;
    const backBtn = document.getElementById('backBtn');

    // Raycasting Plane
    const groundPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const raycaster = new THREE.Raycaster();
    const groundHit = new THREE.Vector3();
    const pointer = new THREE.Vector2(-999, -999);
    let hoveredCard = null;

    // Trigger Shockwave
    let shockStartTime = -100.0;
    function triggerShockwave(x, y) {
      uniforms.uShockOrigin.value.set(x, y);
      shockStartTime = uniforms.uTime.value;
    }

    // Morph Mode Switch
    function switchMode(newMode) {
      currentMode = newMode;
      modeBtn.innerText = `MODE: ${MODES[currentMode]}`;
      const modeKey = (currentMode === 0) ? 'dome' : (currentMode === 1) ? 'helix' : 'ring';

      cardData.forEach((item, i) => {
        const p = formationData[modeKey][i];
        item.mesh.userData.targetPos.set(p.x, p.y, p.z);
        item.textMesh.userData.targetPos.set(p.x, p.y + item.textMesh.userData.yOffset, p.z);
        item.x = p.x;
        item.y = p.y;
        item.z = p.z;
      });
    }

    modeBtn.addEventListener('click', () => switchMode((currentMode + 1) % 3));

    // Keyboard Flight & Navigation
    const keysDown = {};
    let isSprinting = false;

    window.addEventListener('keydown', (e) => {
      keysDown[e.code] = true;
      if (e.shiftKey) isSprinting = true;

      // Space or M: Morph Formations
      if (e.code === 'KeyM' || (e.code === 'Space' && focusedIndex === -1)) {
        switchMode((currentMode + 1) % 3);
      }

      // Quick-Cycle in Focus Mode
      if (focusedIndex !== -1 && cardData.length > 0) {
        if (e.code === 'KeyD' || e.code === 'ArrowRight') {
          focusOnIndex((focusedIndex + 1) % cardData.length);
        } else if (e.code === 'KeyA' || e.code === 'ArrowLeft') {
          focusOnIndex((focusedIndex - 1 + cardData.length) % cardData.length);
        }
      }

      if (e.key === 'Escape') unfocus();
    });

    window.addEventListener('keyup', (e) => {
      keysDown[e.code] = false;
      if (!e.shiftKey) isSprinting = false;
    });

    // Mouse & Cursor Events
    window.addEventListener('mousemove', (e) => {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      if (raycaster.ray.intersectPlane(groundPlane, groundHit)) {
        uniforms.uMouseWorld.value.set(groundHit.x, groundHit.y);
        uniforms.uMouseStrength.value = 1.0;
      }

      if (isDragging) {
        const dx = (e.clientX - prevPointer.x) * 0.04;
        const dy = (e.clientY - prevPointer.y) * 0.04;
        targetPan.x -= dx;
        targetPan.y += dy;
        prevPointer = { x: e.clientX, y: e.clientY };
      }

      // Magnetic Card Hover Tilt
      if (!isDragging && focusedIndex === -1) {
        const cardHits = raycaster.intersectObjects(cardMeshList);
        if (cardHits.length > 0) {
          const hitMesh = cardHits[0].object;
          hoveredCard = hitMesh;
          const localHit = hitMesh.worldToLocal(cardHits[0].point.clone());
          hitMesh.userData.targetRotY = (localHit.x / (hitMesh.geometry.parameters.width * 0.5)) * 0.28;
          hitMesh.userData.targetRotX = -(localHit.y / (hitMesh.geometry.parameters.height * 0.5)) * 0.28;
        } else if (hoveredCard) {
          hoveredCard.userData.targetRotX = 0;
          hoveredCard.userData.targetRotY = 0;
          hoveredCard = null;
        }
      }
    });

    window.addEventListener('mouseleave', () => { uniforms.uMouseStrength.value = 0.0; });

    window.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragStartPos = { x: e.clientX, y: e.clientY };
      prevPointer = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // Wheel Zoom: 4.0 (macro) to 190.0 (wide)
    window.addEventListener('wheel', (e) => {
      if (focusedIndex !== -1 && e.deltaY > 20) {
        unfocus();
        return;
      }
      targetZoom += e.deltaY * 0.035;
      targetZoom = Math.min(Math.max(targetZoom, 4.0), 190.0);
    });

    // Touch Handling
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        dragStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        prevPointer = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isDragging) {
        const dx = (e.touches[0].clientX - prevPointer.x) * 0.045;
        const dy = (e.touches[0].clientY - prevPointer.y) * 0.045;
        targetPan.x -= dx;
        targetPan.y += dy;
        prevPointer = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2 && initialPinchDist) {
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const diff = initialPinchDist - currentDist;
        if (focusedIndex !== -1 && diff > 25) {
          unfocus();
          initialPinchDist = currentDist;
          return;
        }
        targetZoom += diff * 0.07;
        targetZoom = Math.min(Math.max(targetZoom, 4.0), 190.0);
        initialPinchDist = currentDist;
      }
    }, { passive: false });

    window.addEventListener('touchend', () => { isDragging = false; initialPinchDist = null; });

    // Tap Handling: Shockwave + Card Snap or Flip
    function handleTap(clientX, clientY) {
      pointer.x = (clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const intersects = raycaster.intersectObjects(interactiveObjects);
      if (intersects.length > 0) {
        const hit = intersects[0].object;
        const hitIndex = hit.userData.index;

        // Shockwave from tap position
        triggerShockwave(hit.position.x, hit.position.y);

        if (focusedIndex === hitIndex) {
          // Already focused: Flip card 180 degrees
          const mesh = cardData[hitIndex].mesh;
          mesh.userData.isFlipped = !mesh.userData.isFlipped;
          mesh.userData.flipAngle = mesh.userData.isFlipped ? Math.PI : 0;
        } else {
          // Shockwave animation first, then glide into focus
          setTimeout(() => focusOnIndex(hitIndex), 160);
        }
      } else {
        // Tapped canvas: Trigger shockwave
        if (raycaster.ray.intersectPlane(groundPlane, groundHit)) {
          triggerShockwave(groundHit.x, groundHit.y);
        }
        if (focusedIndex !== -1) unfocus();
      }
    }

    window.addEventListener('click', (e) => {
      if (Math.hypot(e.clientX - dragStartPos.x, e.clientY - dragStartPos.y) < 6) {
        handleTap(e.clientX, e.clientY);
      }
    });

    function focusOnIndex(index) {
      focusedIndex = index;
      uniforms.uFocusIndex.value = index;
      backBtn.classList.add('visible');
    }

    function unfocus() {
      if (focusedIndex === -1) return;
      // Reset flip
      if (cardData[focusedIndex]) {
        const mesh = cardData[focusedIndex].mesh;
        mesh.userData.isFlipped = false;
        mesh.userData.flipAngle = 0;
      }
      focusedIndex = -1;
      backBtn.classList.remove('visible');
    }

    backBtn.addEventListener('click', (e) => { e.stopPropagation(); unfocus(); });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 7. Main Render Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();
      uniforms.uTime.value = elapsedTime;

      // Calculate Shockwave Time
      if (shockStartTime > 0) {
        uniforms.uShockTime.value = elapsedTime - shockStartTime;
      }

      // Smooth Morphing of Dome Strength (1.0 in Dome, 0.0 in Helix/Ring)
      const targetDome = (currentMode === 0) ? 1.0 : 0.0;
      uniforms.uDomeStrength.value += (targetDome - uniforms.uDomeStrength.value) * 0.06;

      // Smooth Position Morphing for Formations
      cardMeshList.forEach((mesh, idx) => {
        mesh.position.lerp(mesh.userData.targetPos, 0.07);
        const tMesh = cardData[idx].textMesh;
        tMesh.position.lerp(tMesh.userData.targetPos, 0.07);

        // Magnetic Tilt + 3D Flip
        const targetFlip = mesh.userData.flipAngle || 0;
        mesh.rotation.y += ((targetFlip + (mesh.userData.targetRotY || 0)) - mesh.rotation.y) * 0.1;
        mesh.rotation.x += ((mesh.userData.targetRotX || 0) - mesh.rotation.x) * 0.1;
      });

      // Flight Navigation
      if (focusedIndex === -1) {
        const flySpeed = isSprinting ? 1.35 : 0.55;
        if (keysDown['KeyW'] || keysDown['ArrowUp']) targetPan.y += flySpeed;
        if (keysDown['KeyS'] || keysDown['ArrowDown']) targetPan.y -= flySpeed;
        if (keysDown['KeyA'] || keysDown['ArrowLeft']) targetPan.x -= flySpeed;
        if (keysDown['KeyD'] || keysDown['ArrowRight']) targetPan.x += flySpeed;
      }

      // Smooth Damping
      panOffset.x += (targetPan.x - panOffset.x) * 0.08;
      panOffset.y += (targetPan.y - panOffset.y) * 0.08;
      zoom += (targetZoom - zoom) * 0.08;

      // Shift Warp Effect
      const targetFOV = isSprinting ? 65 : 55;
      camera.fov += (targetFOV - camera.fov) * 0.08;
      camera.updateProjectionMatrix();
      particleMat.uniforms.uSpeedWarp.value += ((isSprinting ? 1.0 : 0.0) - particleMat.uniforms.uSpeedWarp.value) * 0.08;

      if (focusedIndex !== -1) {
        // Focus Framing with Curvature & Elevation
        focusProgress += (1.0 - focusProgress) * 0.08;
        const target = cardData[focusedIndex];
        const focusDist = (target.scale > 1.8) ? 14.5 : 8.8;
        const targetDomeZ = getDomeZ(target.mesh.position.x, target.mesh.position.y);
        const elevatedZ = target.mesh.position.z + targetDomeZ + 4.5;

        camera.position.x += (target.mesh.position.x - camera.position.x) * 0.08;
        camera.position.y += ((target.mesh.position.y - 1.2) - camera.position.y) * 0.08;
        camera.position.z += ((elevatedZ + focusDist) - camera.position.z) * 0.08;
        camera.lookAt(target.mesh.position.x, target.mesh.position.y - 1.2, elevatedZ);
      } else {
        // Upright IMAX Curvature Viewport
        focusProgress += (0.0 - focusProgress) * 0.08;

        const domeBaseZ = getDomeZ(panOffset.x, panOffset.y);
        const defaultCamX = panOffset.x;
        const defaultCamY = panOffset.y - (zoom * 0.22);
        const defaultCamZ = domeBaseZ + (zoom * 0.95);

        camera.position.x += (defaultCamX - camera.position.x) * 0.08;
        camera.position.y += (defaultCamY - camera.position.y) * 0.08;
        camera.position.z += (defaultCamZ - camera.position.z) * 0.08;
        camera.lookAt(panOffset.x, panOffset.y + (zoom * 0.08), domeBaseZ);

        if (focusProgress < 0.01) uniforms.uFocusIndex.value = -1.0;
      }

      uniforms.uFlattenProgress.value = focusProgress;
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
