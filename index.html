<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SKEBOB</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      touch-action: none;
    }
    canvas#webgl {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }
    /* Minimal HUD */
    .hud {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      color: #ffffff;
      pointer-events: none;
    }
    .hud h1 {
      font-size: 13px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-weight: 800;
    }
    .hud p {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #777777;
      margin-top: 4px;
      line-height: 1.5;
    }
    /* Formation Mode Switcher */
    .mode-pill {
      display: inline-block;
      margin-top: 8px;
      padding: 5px 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      font-size: 9px;
      letter-spacing: 0.18em;
      color: #00ffff;
      text-transform: uppercase;
      pointer-events: auto;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .mode-pill:hover {
      background: rgba(0, 255, 255, 0.18);
      border-color: #00ffff;
    }
    /* Return Button */
    .back-btn {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 20;
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 12px 26px;
      border-radius: 999px;
      font-family: monospace;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.45);
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  background 0.2s;
    }
    .back-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    .back-btn:hover {
      background: #e0e0e0;
    }
    .back-btn:active {
      transform: translateX(-50%) scale(0.96);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div class="hud">
    <h1>SKEBOB</h1>
    <p>WASD to glide &bull; Shift for Warp &bull; Tap image to snap &bull; Tap again to 3D Flip</p>
    <div class="mode-pill" id="modeBtn">Formation [SPACE]: Dome Matrix</div>
  </div>
  <button class="back-btn" id="backBtn">&larr; Return to Warp</button>
  <canvas id="webgl"></canvas>

  <script>
    // --- Three.js & Engine Setup ---
    const canvas = document.querySelector('#webgl');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2500);
    camera.position.set(0, -6, 32);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Shared Shader Uniforms
    const uniforms = {
      uTime: { value: 0.0 },
      uWaveHeight: { value: 1.8 },
      uWaveFreq: { value: 0.14 },
      uFocusIndex: { value: -1.0 },
      uFlattenProgress: { value: 0.0 },
      uMouseWorld: { value: new THREE.Vector2(9999.0, 9999.0) },
      uMouseStrength: { value: 0.0 },
      uShockCenter: { value: new THREE.Vector2(0.0, 0.0) },
      uShockRadius: { value: -999.0 },
      uShockIntensity: { value: 0.0 }
    };

    // Shared GLSL: IMAX Spherical Curvature + Ripple + Global Circular Shockwave
    const sphereDomeGLSL = `
      uniform float uTime;
      uniform float uWaveHeight;
      uniform float uWaveFreq;
      uniform vec2 uMouseWorld;
      uniform float uMouseStrength;
      uniform vec2 uShockCenter;
      uniform float uShockRadius;
      uniform float uShockIntensity;
      
      float getDome(vec2 pos) {
        float r2 = dot(pos, pos);
        float R = 210.0;
        float R2 = R * R;
        return R - sqrt(max(R2 - min(r2, R2 - 1.0), 0.0));
      }

      float getWave(vec2 pos) {
        float w1 = sin(pos.x * uWaveFreq + uTime * 0.75) * cos(pos.y * uWaveFreq * 0.8 + uTime * 0.55);
        float w2 = sin((pos.x + pos.y) * uWaveFreq * 0.6 + uTime * 0.4) * 0.5;
        float base = (w1 + w2) * uWaveHeight;

        // Interactive cursor wake
        float d = distance(pos, uMouseWorld);
        float ripple = sin(d * 1.7 - uTime * 5.5) * exp(-d * 0.35) * 1.8 * uMouseStrength;

        // Circular Shockwave across entire world
        float swDist = distance(pos, uShockCenter);
        float swDiff = swDist - uShockRadius;
        float shock = sin(swDiff * 0.28) * exp(-abs(swDiff) * 0.10) * uShockIntensity * 4.2;

        return base + ripple + shock;
      }
    `;

    function getDomeZ(x, y) {
      const r2 = x * x + y * y;
      const R = 210.0;
      return R - Math.sqrt(Math.max(R * R - Math.min(r2, R * R - 1), 0));
    }

    // --- 1. IMAX Spherical Curved Grid ---
    const gridGeo = new THREE.PlaneGeometry(420, 420, 240, 240);
    const gridMat = new THREE.ShaderMaterial({
      uniforms: uniforms,
      vertexShader: `
        ${sphereDomeGLSL}
        varying vec3 vWorldPos;
        void main() {
          vec3 pos = position;
          pos.z += getDome(pos.xy) + getWave(pos.xy);
          vWorldPos = pos;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
      `,
      fragmentShader: `
        varying vec3 vWorldPos;
        void main() {
          vec2 grid = abs(fract(vWorldPos.xy * 0.35 - 0.5) - 0.5) / fwidth(vWorldPos.xy * 0.35);
          float line = min(grid.x, grid.y);
          float c = 1.0 - min(line, 1.0);

          float dist = length(vWorldPos.xy);
          float alpha = smoothstep(195.0, 40.0, dist) * c * 0.55;
          gl_FragColor = vec4(vec3(1.0), alpha);
        }
      `,
      transparent: true
    });
    const gridMesh = new THREE.Mesh(gridGeo, gridMat);
    scene.add(gridMesh);

    // --- 2. High-Visibility Cosmic Particle Volume ---
    const particleCount = 2500;
    const particleGeo = new THREE.BufferGeometry();
    const particlePos = new Float32Array(particleCount * 3);
    const particleSizes = new Float32Array(particleCount);
    const particleSeeds = new Float32Array(particleCount);

    for (let i = 0; i < particleCount; i++) {
      particlePos[i * 3 + 0] = (Math.random() - 0.5) * 320;
      particlePos[i * 3 + 1] = (Math.random() - 0.5) * 320;
      particlePos[i * 3 + 2] = (Math.random() - 0.2) * 55;
      particleSizes[i] = Math.random() * 26.0 + 12.0;
      particleSeeds[i] = Math.random() * 100.0;
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
    particleGeo.setAttribute('aSize', new THREE.BufferAttribute(particleSizes, 1));
    particleGeo.setAttribute('aSeed', new THREE.BufferAttribute(particleSeeds, 1));

    function createParticleTexture() {
      const cvs = document.createElement('canvas');
      cvs.width = 64;
      cvs.height = 64;
      const ctx = cvs.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255,255,255,1.0)');
      grad.addColorStop(0.25, 'rgba(220,245,255,0.85)');
      grad.addColorStop(0.65, 'rgba(120,200,255,0.25)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(cvs);
    }

    const particleUniforms = {
      uTime: uniforms.uTime,
      uTexture: { value: createParticleTexture() },
      uSpeedWarp: { value: 0.0 }
    };

    const particleMat = new THREE.ShaderMaterial({
      uniforms: particleUniforms,
      vertexShader: `
        ${sphereDomeGLSL}
        uniform float uTime;
        uniform float uSpeedWarp;
        attribute float aSize;
        attribute float aSeed;
        varying float vAlpha;

        void main() {
          vec3 pos = position;
          pos.z += getDome(pos.xy) * 0.7;
          pos.z += sin(uTime * 0.9 + aSeed) * 1.5;
          pos.x += cos(uTime * 0.45 + aSeed) * 0.8;

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          gl_Position = projectionMatrix * mvPosition;

          float twinkle = sin(uTime * 2.2 + aSeed) * 0.35 + 0.65;
          gl_PointSize = max(2.0, (aSize * twinkle * (1.0 + uSpeedWarp * 1.1)) * (160.0 / -mvPosition.z));
          vAlpha = smoothstep(280.0, 10.0, -mvPosition.z) * 0.85;
        }
      `,
      fragmentShader: `
        uniform sampler2D uTexture;
        varying float vAlpha;
        void main() {
          vec4 tex = texture2D(uTexture, gl_PointCoord);
          gl_FragColor = vec4(tex.rgb, tex.a * vAlpha);
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const particleSystem = new THREE.Points(particleGeo, particleMat);
    scene.add(particleSystem);

    // --- 3. Multi-Line Text Texture Helper (Prevents Text Cutting Off) ---
    function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines = 3) {
      const words = text.split(' ');
      let line = '';
      let currentY = y;
      let count = 0;

      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line.trim(), x, currentY);
          line = words[n] + ' ';
          currentY += lineHeight;
          count++;
          if (count >= maxLines - 1 && n < words.length - 1) {
            let remaining = words.slice(n).join(' ');
            while (ctx.measureText(remaining + '...').width > maxWidth && remaining.length > 0) {
              remaining = remaining.substring(0, remaining.length - 1);
            }
            ctx.fillText(remaining + '...', x, currentY);
            return;
          }
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line.trim(), x, currentY);
    }

    function makeTextTexture(title, desc) {
      const cvs = document.createElement('canvas');
      cvs.width = 1024;
      cvs.height = 320;
      const ctx = cvs.getContext('2d');
      ctx.clearRect(0, 0, cvs.width, cvs.height);

      ctx.fillStyle = "#ffffff";
      ctx.font = "900 46px monospace";
      ctx.textAlign = "center";
      ctx.fillText(title.toUpperCase(), 512, 85);

      ctx.fillStyle = "#a2a2a8";
      ctx.font = "500 27px monospace";
      ctx.textAlign = "center";
      wrapText(ctx, desc || "Archival record", 512, 145, 920, 36, 3);

      const tex = new THREE.CanvasTexture(cvs);
      tex.needsUpdate = true;
      return tex;
    }

    // --- 4. Card Backside Generator (Brushed Silver Collectible Card Slab) ---
    function makeCardBackTexture(item, index) {
      const cvs = document.createElement('canvas');
      cvs.width = 1024;
      cvs.height = 1024;
      const ctx = cvs.getContext('2d');

      // Brushed Metallic Titanium Gradient
      const grad = ctx.createLinearGradient(0, 0, 1024, 1024);
      grad.addColorStop(0, '#1a1a20');
      grad.addColorStop(0.3, '#32323c');
      grad.addColorStop(0.5, '#ececf2');
      grad.addColorStop(0.7, '#383842');
      grad.addColorStop(1, '#111116');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 1024);

      // Tech Inner Border Frame
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 4;
      ctx.strokeRect(60, 60, 904, 904);

      // Corner Brackets on Card Back
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 10;
      // Top Left
      ctx.strokeRect(50, 50, 60, 10);
      ctx.strokeRect(50, 50, 10, 60);
      // Bottom Right
      ctx.strokeRect(914, 964, 60, 10);
      ctx.strokeRect(964, 914, 10, 60);

      // Specular Holographic Diagonal Sheen
      const sheen = ctx.createLinearGradient(150, 0, 850, 1024);
      sheen.addColorStop(0.4, 'rgba(255,255,255,0)');
      sheen.addColorStop(0.5, 'rgba(255,255,255,0.28)');
      sheen.addColorStop(0.6, 'rgba(255,255,255,0)');
      ctx.fillStyle = sheen;
      ctx.fillRect(60, 60, 904, 904);

      // Header Tag
      ctx.fillStyle = '#8f8f99';
      ctx.font = '800 24px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`SKEBOB ARCHIVE // CORE ARTIFACT #${String(index + 1).padStart(3, '0')}`, 512, 160);

      // Main Title
      ctx.fillStyle = '#0a0a0d';
      ctx.font = '900 58px monospace';
      ctx.fillText((item.title || "Skebob").toUpperCase(), 512, 340);

      // Divider Line
      ctx.strokeStyle = '#0a0a0d';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(260, 390);
      ctx.lineTo(764, 390);
      ctx.stroke();

      // Description & Meta
      ctx.fillStyle = '#1c1c22';
      ctx.font = '600 30px monospace';
      wrapText(ctx, item.description || "Authentic verified digital specimen.", 512, 470, 780, 44, 5);

      // Security Footer Details
      ctx.fillStyle = '#656570';
      ctx.font = '700 20px monospace';
      ctx.fillText("CLASSIFIED SKEBOB SPECIFICATION &bull; ENCRYPTED METADATA", 512, 850);

      const tex = new THREE.CanvasTexture(cvs);
      tex.needsUpdate = true;
      return tex;
    }

    // --- 5. Formations & Initialization ---
    const interactiveObjects = [];
    const cardMeshList = [];
    const textMeshList = [];
    const cardData = [];
    const cardGroup = new THREE.Group();
    scene.add(cardGroup);

    const texLoader = new THREE.TextureLoader();

    // Formation Types: 0: Dome Matrix, 1: DNA Double Helix, 2: Saturn Orbital Ring
    let currentFormation = 0;
    const formationNames = ["Dome Matrix", "DNA Double Helix", "Saturn Orbital Ring"];
    const modeBtn = document.getElementById('modeBtn');

    function switchFormation() {
      currentFormation = (currentFormation + 1) % 3;
      modeBtn.textContent = `Formation [SPACE]: ${formationNames[currentFormation]}`;
    }
    modeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      switchFormation();
    });

    fetch('list.json')
      .then(res => res.json())
      .then(data => initGallery(data))
      .catch(err => console.error("Error loading list.json:", err));

    function initGallery(items) {
      let heroIndex = items.findIndex(item => item.src.includes('original-skebob.jpg'));
      if (heroIndex > -1) {
        const [hero] = items.splice(heroIndex, 1);
        items.unshift(hero);
      }

      // 1. Calculate Dome Positions (Spiral)
      const domePositions = [{ x: 0, y: 0, scale: 2.4, isHero: true }];
      let currentRadius = 16.0;
      let angle = 0;
      for (let i = 1; i < items.length; i++) {
        let placed = false;
        let attempts = 0;
        while (!placed && attempts < 200) {
          attempts++;
          angle += 0.85 + (Math.random() * 0.25);
          currentRadius += 0.55;
          const jitter = (Math.random() - 0.5) * 4.0;
          const x = Math.cos(angle) * (currentRadius + jitter);
          const y = Math.sin(angle) * (currentRadius + jitter);
          if (!domePositions.some(p => Math.hypot(p.x - x, p.y - y) < 14.5)) {
            domePositions.push({
              x,
              y,
              scale: 0.95 + Math.random() * 0.45,
              rot: (Math.random() - 0.5) * 0.18
            });
            placed = true;
          }
        }
      }

      items.forEach((item, index) => {
        const posD = domePositions[index];
        const baseW = 5.2 * posD.scale;
        const baseH = 5.2 * posD.scale;

        // Formation 1: DNA Double Helix
        const strand = index % 2;
        const helixAngle = (index / items.length) * (6.0 * Math.PI) + (strand * Math.PI);
        const helixRadius = 21.0;
        const posHelix = {
          x: Math.cos(helixAngle) * helixRadius,
          y: (index - items.length * 0.5) * 4.2,
          z: Math.sin(helixAngle) * helixRadius + 15.0,
          rotY: -helixAngle + Math.PI * 0.5,
          rotZ: 0
        };

        // Formation 2: Saturn Orbital Ring
        const ringAngle = (index / items.length) * (2.0 * Math.PI);
        const ringRadius = 26.0 + (index % 4) * 6.8;
        const posRing = {
          x: Math.cos(ringAngle) * ringRadius,
          y: Math.sin(ringAngle) * ringRadius * 0.62,
          z: Math.sin(ringAngle) * ringRadius * 0.32,
          rotY: 0,
          rotZ: ringAngle - Math.PI * 0.5
        };

        const texture = texLoader.load(item.src);
        const backTexture = makeCardBackTexture(item, index);

        // Card Shader: Front (White Corner Border Lines) + Back (3D Flip Metallic Card)
        const cardGeo = new THREE.PlaneGeometry(baseW, baseH, 32, 32);
        const cardMat = new THREE.ShaderMaterial({
          uniforms: {
            ...uniforms,
            uTexture: { value: texture },
            uBackTexture: { value: backTexture },
            uIndex: { value: index }
          },
          vertexShader: `
            ${sphereDomeGLSL}
            uniform float uIndex;
            uniform float uFocusIndex;
            uniform float uFlattenProgress;
            varying vec2 vUv;

            void main() {
              vUv = uv;
              vec3 pos = position;
              vec4 worldPos = modelMatrix * vec4(pos, 1.0);

              float domeZ = getDome(worldPos.xy);
              float waveZ = getWave(worldPos.xy);

              if (abs(uIndex - uFocusIndex) < 0.1) {
                waveZ = mix(waveZ, 0.0, uFlattenProgress);
                worldPos.z += uFlattenProgress * 4.0;
              }

              worldPos.z += domeZ + waveZ + 0.12;
              gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
          `,
          fragmentShader: `
            uniform sampler2D uTexture;
            uniform sampler2D uBackTexture;
            uniform float uTime;
            varying vec2 vUv;

            void main() {
              if (gl_FrontFacing) {
                // Front Face: Artwork with White Border Lines in Corners
                vec4 tex = texture2D(uTexture, vUv);

                // Smooth perimeter edge feathering
                float edge = smoothstep(0.0, 0.038, vUv.x) * smoothstep(1.0, 0.962, vUv.x) *
                             smoothstep(0.0, 0.038, vUv.y) * smoothstep(1.0, 0.962, vUv.y);

                // White BORDER CORNER LINES (Viewfinder Corner Brackets)
                float bw = 0.016;       // border line thickness
                float cLen = 0.22;     // length of corner lines

                // Top-Right Corner Border Line
                vec2 dTR = vec2(1.0) - vUv;
                float trLineH = step(0.0, dTR.y) * step(dTR.y, bw) * smoothstep(cLen, 0.0, dTR.x);
                float trLineV = step(0.0, dTR.x) * step(dTR.x, bw) * smoothstep(cLen, 0.0, dTR.y);
                float trBorder = max(trLineH, trLineV);

                // Bottom-Left Corner Border Line
                vec2 dBL = vUv;
                float blLineH = step(0.0, dBL.y) * step(dBL.y, bw) * smoothstep(cLen, 0.0, dBL.x);
                float blLineV = step(0.0, dBL.x) * step(dBL.x, bw) * smoothstep(cLen, 0.0, dBL.y);
                float blBorder = max(blLineH, blLineV);

                float borderLines = max(trBorder, blBorder);

                vec3 col = mix(tex.rgb, vec3(1.0), borderLines);
                float alpha = max(edge * 0.96, borderLines);

                gl_FragColor = vec4(col, alpha);
              } else {
                // Back Face: 3D Flip Brushed Metallic Card
                vec2 backUv = vec2(1.0 - vUv.x, vUv.y);
                vec4 backTex = texture2D(uBackTexture, backUv);

                float sheen = sin((backUv.x + backUv.y) * 4.0 - uTime * 2.5) * 0.14;
                vec3 col = backTex.rgb + vec3(sheen);
                float edge = smoothstep(0.0, 0.035, backUv.x) * smoothstep(1.0, 0.965, backUv.x) *
                             smoothstep(0.0, 0.035, backUv.y) * smoothstep(1.0, 0.965, backUv.y);

                gl_FragColor = vec4(col, edge * backTex.a);
              }
            }
          `,
          transparent: true,
          alphaTest: 0.01,
          side: THREE.DoubleSide
        });

        const cardMesh = new THREE.Mesh(cardGeo, cardMat);
        cardMesh.position.set(posD.x, posD.y, 0);
        if (posD.rot) cardMesh.rotation.z = posD.rot;

        cardMesh.userData = {
          index,
          item,
          scale: posD.scale,
          posDome: { x: posD.x, y: posD.y, z: 0, rotX: 0, rotY: 0, rotZ: posD.rot || 0 },
          posHelix: posHelix,
          posRing: posRing,
          targetRotX: 0,
          targetRotY: 0,
          isFlipped: false,
          currentFlip: 0.0
        };

        cardGroup.add(cardMesh);
        interactiveObjects.push(cardMesh);
        cardMeshList.push(cardMesh);

        // Subtitle Mesh
        const textH = 1.35 * posD.scale;
        const textGeo = new THREE.PlaneGeometry(baseW * 1.3, textH, 24, 8);
        const textTex = makeTextTexture(item.title || "Skebob", item.description || "");

        const textMat = new THREE.ShaderMaterial({
          uniforms: {
            ...uniforms,
            uTexture: { value: textTex },
            uIndex: { value: index },
            uSubAlpha: { value: 1.0 }
          },
          vertexShader: `
            ${sphereDomeGLSL}
            uniform float uIndex;
            uniform float uFocusIndex;
            uniform float uFlattenProgress;
            varying vec2 vUv;

            void main() {
              vUv = uv;
              vec3 pos = position;
              vec4 worldPos = modelMatrix * vec4(pos, 1.0);

              float domeZ = getDome(worldPos.xy);
              float waveZ = getWave(worldPos.xy);

              if (abs(uIndex - uFocusIndex) < 0.1) {
                waveZ = mix(waveZ, 0.0, uFlattenProgress);
                worldPos.z += uFlattenProgress * 4.0;
              }

              worldPos.z += domeZ + waveZ + 0.35;
              gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
          `,
          fragmentShader: `
            uniform sampler2D uTexture;
            uniform float uSubAlpha;
            varying vec2 vUv;
            void main() {
              vec4 tex = texture2D(uTexture, vUv);
              gl_FragColor = vec4(tex.rgb, tex.a * uSubAlpha);
            }
          `,
          transparent: true,
          side: THREE.DoubleSide
        });

        const textMesh = new THREE.Mesh(textGeo, textMat);
        const yOffset = -(baseH * 0.5 + textH * 0.65);
        textMesh.position.set(posD.x, posD.y + yOffset, 0);
        if (posD.rot) textMesh.rotation.z = posD.rot;
        textMesh.userData = { index, yOffset, parentCard: cardMesh };

        cardGroup.add(textMesh);
        interactiveObjects.push(textMesh);
        textMeshList.push(textMesh);

        cardData.push({ x: posD.x, y: posD.y, scale: posD.scale });
      });
    }

    // --- 6. Controls, Flight, Shockwave & Interaction ---
    let isDragging = false;
    let dragStartPos = { x: 0, y: 0 };
    let prevPointer = { x: 0, y: 0 };
    let targetPan = { x: 0, y: 0 };
    let panOffset = { x: 0, y: 0 };

    // Massive Zoom Range
    let targetZoom = 32.0;
    let zoom = 32.0;
    let initialPinchDist = null;

    let focusedIndex = -1;
    let focusProgress = 0.0;
    let delayedFocusTimeout = null;
    const backBtn = document.getElementById('backBtn');

    // Global Shockwave State
    let shockRadius = -999.0;
    let shockIntensity = 0.0;

    function triggerShockwave(worldX, worldY) {
      uniforms.uShockCenter.value.set(worldX, worldY);
      shockRadius = 0.0;
      shockIntensity = 1.0;
    }

    const groundPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const groundRaycaster = new THREE.Raycaster();
    const groundHit = new THREE.Vector3();
    const pointer = new THREE.Vector2(-999, -999);
    let hoveredCard = null;

    const keysDown = {};
    let isSprinting = false;

    window.addEventListener('keydown', (e) => {
      keysDown[e.code] = true;
      if (e.shiftKey) isSprinting = true;

      // Formation Mode Switch via Space or M
      if (e.code === 'Space' || e.code === 'KeyM') {
        switchFormation();
      }

      // Quick Carousel Navigation when Focused
      if (focusedIndex !== -1 && cardData.length > 0) {
        if (e.code === 'KeyD' || e.code === 'ArrowRight') {
          focusOnIndex((focusedIndex + 1) % cardData.length);
        } else if (e.code === 'KeyA' || e.code === 'ArrowLeft') {
          focusOnIndex((focusedIndex - 1 + cardData.length) % cardData.length);
        }
      }

      if (e.key === 'Escape') unfocus();
    });

    window.addEventListener('keyup', (e) => {
      keysDown[e.code] = false;
      if (!e.shiftKey) isSprinting = false;
    });

    // Mouse & Cursor Wake
    window.addEventListener('mousemove', (e) => {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;

      groundRaycaster.setFromCamera(pointer, camera);
      if (groundRaycaster.ray.intersectPlane(groundPlane, groundHit)) {
        uniforms.uMouseWorld.value.set(groundHit.x, groundHit.y);
        uniforms.uMouseStrength.value = 1.0;
      }

      if (isDragging) {
        const dx = (e.clientX - prevPointer.x) * 0.04;
        const dy = (e.clientY - prevPointer.y) * 0.04;
        targetPan.x -= dx;
        targetPan.y += dy;
        prevPointer = { x: e.clientX, y: e.clientY };
      }

      // Magnetic Hover Tilt
      if (!isDragging && focusedIndex === -1) {
        const cardHits = groundRaycaster.intersectObjects(cardMeshList);
        if (cardHits.length > 0) {
          const hitMesh = cardHits[0].object;
          hoveredCard = hitMesh;
          const localHit = hitMesh.worldToLocal(cardHits[0].point.clone());
          hitMesh.userData.targetRotY = (localHit.x / (hitMesh.geometry.parameters.width * 0.5)) * 0.28;
          hitMesh.userData.targetRotX = -(localHit.y / (hitMesh.geometry.parameters.height * 0.5)) * 0.28;
        } else if (hoveredCard) {
          hoveredCard.userData.targetRotX = 0;
          hoveredCard.userData.targetRotY = 0;
          hoveredCard = null;
        }
      }
    });

    window.addEventListener('mouseleave', () => {
      uniforms.uMouseStrength.value = 0.0;
    });

    window.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragStartPos = { x: e.clientX, y: e.clientY };
      prevPointer = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // Desktop Wheel Zoom with Massive Range
    window.addEventListener('wheel', (e) => {
      if (focusedIndex !== -1 && e.deltaY > 20) {
        unfocus();
        return;
      }
      targetZoom += e.deltaY * 0.04;
      targetZoom = Math.min(Math.max(targetZoom, 3.5), 190.0);
    });

    // Mobile Touch Events
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        dragStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        prevPointer = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isDragging) {
        const dx = (e.touches[0].clientX - prevPointer.x) * 0.045;
        const dy = (e.touches[0].clientY - prevPointer.y) * 0.045;
        targetPan.x -= dx;
        targetPan.y += dy;
        prevPointer = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2 && initialPinchDist) {
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const diff = initialPinchDist - currentDist;

        if (focusedIndex !== -1 && diff > 25) {
          unfocus();
          initialPinchDist = currentDist;
          return;
        }

        targetZoom += diff * 0.08;
        targetZoom = Math.min(Math.max(targetZoom, 3.5), 190.0);
        initialPinchDist = currentDist;
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        isDragging = false;
        initialPinchDist = null;
      }
    });

    // Raycasting, Circular Shockwave & Tap-to-Snap / 3D Flip
    const clickRaycaster = new THREE.Raycaster();
    function handleTap(clientX, clientY) {
      pointer.x = (clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(clientY / window.innerHeight) * 2 + 1;
      clickRaycaster.setFromCamera(pointer, camera);

      const intersects = clickRaycaster.intersectObjects(interactiveObjects);
      
      // Tap on Ground or Empty Canvas
      if (clickRaycaster.ray.intersectPlane(groundPlane, groundHit)) {
        triggerShockwave(groundHit.x, groundHit.y);
      }

      if (intersects.length > 0) {
        const hit = intersects[0].object;
        const index = hit.userData.index;

        if (focusedIndex === index) {
          // Tap focused image again -> 3D Flip!
          const cardMesh = cardMeshList[index];
          cardMesh.userData.isFlipped = !cardMesh.userData.isFlipped;
        } else {
          // Tap new image -> Kinetic wave first, then slide into focus
          const cardMesh = cardMeshList[index];
          triggerShockwave(cardMesh.position.x, cardMesh.position.y);

          if (delayedFocusTimeout) clearTimeout(delayedFocusTimeout);
          delayedFocusTimeout = setTimeout(() => {
            focusOnIndex(index);
          }, 240);
        }
      } else if (focusedIndex !== -1) {
        unfocus();
      }
    }

    window.addEventListener('click', (e) => {
      if (Math.hypot(e.clientX - dragStartPos.x, e.clientY - dragStartPos.y) < 6) {
        handleTap(e.clientX, e.clientY);
      }
    });

    function focusOnIndex(index) {
      focusedIndex = index;
      uniforms.uFocusIndex.value = index;
      backBtn.classList.add('visible');

      // Reset flip state on new focus
      cardMeshList.forEach((mesh, idx) => {
        if (idx !== index) mesh.userData.isFlipped = false;
      });
    }

    function unfocus() {
      if (focusedIndex === -1) return;
      cardMeshList.forEach(m => m.userData.isFlipped = false);
      focusedIndex = -1;
      backBtn.classList.remove('visible');
    }

    backBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      unfocus();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 7. Main Render Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();
      uniforms.uTime.value = elapsedTime;

      // Shockwave Propagation
      if (shockIntensity > 0.005) {
        shockRadius += 4.5;
        shockIntensity *= 0.965;
        uniforms.uShockRadius.value = shockRadius;
        uniforms.uShockIntensity.value = shockIntensity;
      } else {
        uniforms.uShockIntensity.value = 0.0;
      }

      // WASD Flight
      if (focusedIndex === -1) {
        const flySpeed = (isSprinting ? 1.6 : 0.65);
        if (keysDown['KeyW'] || keysDown['ArrowUp']) targetPan.y += flySpeed;
        if (keysDown['KeyS'] || keysDown['ArrowDown']) targetPan.y -= flySpeed;
        if (keysDown['KeyA'] || keysDown['ArrowLeft']) targetPan.x -= flySpeed;
        if (keysDown['KeyD'] || keysDown['ArrowRight']) targetPan.x += flySpeed;
      }

      panOffset.x += (targetPan.x - panOffset.x) * 0.08;
      panOffset.y += (targetPan.y - panOffset.y) * 0.08;
      zoom += (targetZoom - zoom) * 0.08;

      // Warp FOV Shift
      const targetFOV = isSprinting ? 65 : 55;
      camera.fov += (targetFOV - camera.fov) * 0.08;
      camera.updateProjectionMatrix();
      particleUniforms.uSpeedWarp.value += ((isSprinting ? 1.0 : 0.0) - particleUniforms.uSpeedWarp.value) * 0.08;

      // Smooth Morphing Between Formations
      cardMeshList.forEach((mesh, idx) => {
        let tPos, tRot;
        if (currentFormation === 0) {
          tPos = mesh.userData.posDome;
          tRot = mesh.userData.posDome;
        } else if (currentFormation === 1) {
          tPos = mesh.userData.posHelix;
          tRot = mesh.userData.posHelix;
        } else {
          tPos = mesh.userData.posRing;
          tRot = mesh.userData.posRing;
        }

        // Lerp position
        mesh.position.x += (tPos.x - mesh.position.x) * 0.07;
        mesh.position.y += (tPos.y - mesh.position.y) * 0.07;
        mesh.position.z += (tPos.z - mesh.position.z) * 0.07;

        // 3D Card Flip Angle
        const targetFlipAngle = mesh.userData.isFlipped ? Math.PI : 0.0;
        mesh.userData.currentFlip = THREE.MathUtils.lerp(mesh.userData.currentFlip, targetFlipAngle, 0.1);

        // Magnetic Tilt + Flip
        const hoverX = (focusedIndex === idx) ? 0 : (mesh.userData.targetRotX || 0);
        const hoverY = (focusedIndex === idx) ? 0 : (mesh.userData.targetRotY || 0);

        mesh.rotation.x += (tRot.rotX + hoverX - mesh.rotation.x) * 0.08;
        mesh.rotation.y += (tRot.rotY + hoverY + mesh.userData.currentFlip - mesh.rotation.y) * 0.08;
        mesh.rotation.z += (tRot.rotZ - mesh.rotation.z) * 0.08;

        // Accompanying Text Mesh Follow
        const tMesh = textMeshList[idx];
        tMesh.position.x = mesh.position.x;
        tMesh.position.y = mesh.position.y + tMesh.userData.yOffset;
        tMesh.position.z = mesh.position.z;
        tMesh.rotation.copy(mesh.rotation);
        tMesh.rotation.y = tRot.rotY + hoverY; // Keep text readable
        tMesh.material.uniforms.uSubAlpha.value = 1.0 - Math.min(1.0, mesh.userData.currentFlip * 1.2);
      });

      if (focusedIndex !== -1) {
        focusProgress += (1.0 - focusProgress) * 0.08;
        const targetMesh = cardMeshList[focusedIndex];
        const focusDist = (targetMesh.userData.scale > 1.8) ? 14.5 : 8.8;
        const targetDomeZ = getDomeZ(targetMesh.position.x, targetMesh.position.y);
        const elevatedZ = targetMesh.position.z + targetDomeZ + 4.0;

        camera.position.x += (targetMesh.position.x - camera.position.x) * 0.08;
        camera.position.y += ((targetMesh.position.y - 1.2) - camera.position.y) * 0.08;
        camera.position.z += ((elevatedZ + focusDist) - camera.position.z) * 0.08;
        camera.lookAt(targetMesh.position.x, targetMesh.position.y - 1.2, elevatedZ);
      } else {
        focusProgress += (0.0 - focusProgress) * 0.08;

        const domeBaseZ = getDomeZ(panOffset.x, panOffset.y);
        const defaultCamX = panOffset.x;
        const defaultCamY = panOffset.y - (zoom * 0.22);
        const defaultCamZ = domeBaseZ + (zoom * 0.95);

        camera.position.x += (defaultCamX - camera.position.x) * 0.08;
        camera.position.y += (defaultCamY - camera.position.y) * 0.08;
        camera.position.z += (defaultCamZ - camera.position.z) * 0.08;
        camera.lookAt(panOffset.x, panOffset.y + (zoom * 0.08), domeBaseZ);

        if (focusProgress < 0.01) {
          uniforms.uFocusIndex.value = -1.0;
        }
      }

      uniforms.uFlattenProgress.value = focusProgress;
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
