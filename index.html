<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SKEBOB</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      touch-action: none;
    }
    canvas#webgl {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }
    /* Minimal HUD */
    .hud {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      color: #ffffff;
      pointer-events: none;
    }
    .hud h1 {
      font-size: 13px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-weight: 800;
    }
    .hud p {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #777777;
      margin-top: 4px;
      line-height: 1.5;
    }
    /* Return Button */
    .back-btn {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 20;
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 12px 26px;
      border-radius: 999px;
      font-family: monospace;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.45);
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  background 0.2s;
    }
    .back-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    .back-btn:hover {
      background: #e0e0e0;
    }
    .back-btn:active {
      transform: translateX(-50%) scale(0.96);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div class="hud">
    <h1>SKEBOB</h1>
    <p>WASD / Arrows to glide &bull; Shift for Warp &bull; Cursor wakes waves &bull; Tap to snap</p>
  </div>
  <button class="back-btn" id="backBtn">&larr; Return to Warp</button>
  <canvas id="webgl"></canvas>

  <script>
    // --- Three.js & Engine Setup ---
    const canvas = document.querySelector('#webgl');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, -6, 32);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Shared Shader Uniforms
    const uniforms = {
      uTime: { value: 0.0 },
      uWaveHeight: { value: 1.8 },
      uWaveFreq: { value: 0.14 },
      uFocusIndex: { value: -1.0 },
      uFlattenProgress: { value: 0.0 },
      uMouseWorld: { value: new THREE.Vector2(9999.0, 9999.0) },
      uMouseStrength: { value: 0.0 }
    };

    // Shared GLSL: IMAX Spherical Dome Warp + Cursor Dynamic Ripples
    const sphereDomeGLSL = `
      uniform float uTime;
      uniform float uWaveHeight;
      uniform float uWaveFreq;
      uniform vec2 uMouseWorld;
      uniform float uMouseStrength;
      
      // Inside-of-Sphere IMAX Bowl Curvature
      float getDome(vec2 pos) {
        float r2 = dot(pos, pos);
        float R = 190.0;
        float R2 = R * R;
        return R - sqrt(max(R2 - min(r2, R2 - 1.0), 0.0));
      }

      float getWave(vec2 pos) {
        float w1 = sin(pos.x * uWaveFreq + uTime * 0.75) * cos(pos.y * uWaveFreq * 0.8 + uTime * 0.55);
        float w2 = sin((pos.x + pos.y) * uWaveFreq * 0.6 + uTime * 0.4) * 0.5;
        float base = (w1 + w2) * uWaveHeight;

        // Dynamic cursor ripple wake
        float d = distance(pos, uMouseWorld);
        float ripple = sin(d * 1.7 - uTime * 5.5) * exp(-d * 0.35) * 1.8 * uMouseStrength;

        return base + ripple;
      }
    `;

    // CPU counterpart for camera framing
    function getDomeZ(x, y) {
      const r2 = x * x + y * y;
      const R = 190.0;
      return R - Math.sqrt(Math.max(R * R - Math.min(r2, R * R - 1), 0));
    }

    // --- 1. IMAX Spherical Curved Grid ---
    const gridGeo = new THREE.PlaneGeometry(280, 280, 220, 220);
    const gridMat = new THREE.ShaderMaterial({
      uniforms: uniforms,
      vertexShader: `
        ${sphereDomeGLSL}
        varying vec3 vWorldPos;
        void main() {
          vec3 pos = position;
          pos.z += getDome(pos.xy) + getWave(pos.xy);
          vWorldPos = pos;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
      `,
      fragmentShader: `
        varying vec3 vWorldPos;
        void main() {
          vec2 grid = abs(fract(vWorldPos.xy * 0.35 - 0.5) - 0.5) / fwidth(vWorldPos.xy * 0.35);
          float line = min(grid.x, grid.y);
          float c = 1.0 - min(line, 1.0);

          float dist = length(vWorldPos.xy);
          float alpha = smoothstep(135.0, 35.0, dist) * c * 0.55;
          gl_FragColor = vec4(vec3(1.0), alpha);
        }
      `,
      transparent: true
    });
    const gridMesh = new THREE.Mesh(gridGeo, gridMat);
    scene.add(gridMesh);

    // --- 2. Floating Cosmic Particles in the IMAX Dome ---
    const particleCount = 2200;
    const particleGeo = new THREE.BufferGeometry();
    const particlePos = new Float32Array(particleCount * 3);
    const particleSizes = new Float32Array(particleCount);
    const particleSeeds = new Float32Array(particleCount);

    for (let i = 0; i < particleCount; i++) {
      particlePos[i * 3 + 0] = (Math.random() - 0.5) * 230;
      particlePos[i * 3 + 1] = (Math.random() - 0.5) * 230;
      particlePos[i * 3 + 2] = (Math.random() - 0.25) * 35;
      particleSizes[i] = Math.random() * 20.0 + 8.0;
      particleSeeds[i] = Math.random() * 100.0;
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
    particleGeo.setAttribute('aSize', new THREE.BufferAttribute(particleSizes, 1));
    particleGeo.setAttribute('aSeed', new THREE.BufferAttribute(particleSeeds, 1));

    function createParticleTexture() {
      const cvs = document.createElement('canvas');
      cvs.width = 64;
      cvs.height = 64;
      const ctx = cvs.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.3, 'rgba(255,255,255,0.7)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(cvs);
    }

    const particleUniforms = {
      uTime: uniforms.uTime,
      uTexture: { value: createParticleTexture() },
      uSpeedWarp: { value: 0.0 }
    };

    const particleMat = new THREE.ShaderMaterial({
      uniforms: particleUniforms,
      vertexShader: `
        ${sphereDomeGLSL}
        uniform float uTime;
        uniform float uSpeedWarp;
        attribute float aSize;
        attribute float aSeed;
        varying float vAlpha;

        void main() {
          vec3 pos = position;
          pos.z += getDome(pos.xy);
          pos.z += sin(uTime * 0.8 + aSeed) * 0.8;
          pos.x += cos(uTime * 0.4 + aSeed) * 0.5;

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          gl_Position = projectionMatrix * mvPosition;

          float twinkle = sin(uTime * 2.0 + aSeed) * 0.35 + 0.65;
          gl_PointSize = (aSize * twinkle * (1.0 + uSpeedWarp * 0.85)) * (15.0 / -mvPosition.z);
          vAlpha = smoothstep(70.0, 5.0, -mvPosition.z) * 0.7;
        }
      `,
      fragmentShader: `
        uniform sampler2D uTexture;
        varying float vAlpha;
        void main() {
          vec4 tex = texture2D(uTexture, gl_PointCoord);
          gl_FragColor = vec4(tex.rgb, tex.a * vAlpha);
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const particleSystem = new THREE.Points(particleGeo, particleMat);
    scene.add(particleSystem);

    // --- 3. Canvas Texture Helper for Titles ---
    function makeTextTexture(title, desc) {
      const cvs = document.createElement('canvas');
      cvs.width = 1024;
      cvs.height = 256;
      const ctx = cvs.getContext('2d');
      ctx.clearRect(0, 0, cvs.width, cvs.height);

      ctx.fillStyle = "#ffffff";
      ctx.font = "900 48px monospace";
      ctx.textAlign = "center";
      ctx.fillText(title.toUpperCase(), 512, 85);

      ctx.fillStyle = "#a2a2a8";
      ctx.font = "500 30px monospace";
      ctx.textAlign = "center";
      ctx.fillText(desc, 512, 160);

      const tex = new THREE.CanvasTexture(cvs);
      tex.needsUpdate = true;
      return tex;
    }

    // --- 4. Scatter Logic & Card Initialization ---
    const interactiveObjects = [];
    const cardMeshList = [];
    const cardData = [];
    const cardGroup = new THREE.Group();
    scene.add(cardGroup);

    const texLoader = new THREE.TextureLoader();

    function getOrganicPositions(count, minDistance = 14.5) {
      const positions = [{ x: 0, y: 0, scale: 2.4, isHero: true }];
      let currentRadius = 16.0;
      let angle = 0;

      for (let i = 1; i < count; i++) {
        let placed = false;
        let attempts = 0;
        while (!placed && attempts < 200) {
          attempts++;
          angle += 0.85 + (Math.random() * 0.25);
          currentRadius += 0.55;
          const jitter = (Math.random() - 0.5) * 4.0;
          const x = Math.cos(angle) * (currentRadius + jitter);
          const y = Math.sin(angle) * (currentRadius + jitter);

          const tooClose = positions.some(p => Math.hypot(p.x - x, p.y - y) < minDistance);
          if (!tooClose) {
            positions.push({
              x,
              y,
              scale: 0.95 + Math.random() * 0.45,
              rot: (Math.random() - 0.5) * 0.18,
              isHero: false
            });
            placed = true;
          }
        }
      }
      return positions;
    }

    fetch('list.json')
      .then(res => res.json())
      .then(data => initGallery(data))
      .catch(err => console.error("Error loading list.json:", err));

    function initGallery(items) {
      let heroIndex = items.findIndex(item => item.src.includes('original-skebob.jpg'));
      if (heroIndex > -1) {
        const [hero] = items.splice(heroIndex, 1);
        items.unshift(hero);
      }

      const positions = getOrganicPositions(items.length);

      items.forEach((item, index) => {
        const pos = positions[index];
        const baseW = 5.2 * pos.scale;
        const baseH = 5.2 * pos.scale;

        // Card Mesh (Subdivided so it bends smoothly along the sphere)
        const cardGeo = new THREE.PlaneGeometry(baseW, baseH, 32, 32);
        const texture = texLoader.load(item.src);

        const cardMat = new THREE.ShaderMaterial({
          uniforms: {
            ...uniforms,
            uTexture: { value: texture },
            uIndex: { value: index }
          },
          vertexShader: `
            ${sphereDomeGLSL}
            uniform float uIndex;
            uniform float uFocusIndex;
            uniform float uFlattenProgress;
            varying vec2 vUv;

            void main() {
              vUv = uv;
              vec3 pos = position;
              vec4 worldPos = modelMatrix * vec4(pos, 1.0);

              float domeZ = getDome(worldPos.xy);
              float waveZ = getWave(worldPos.xy);

              // Elevate and calm wave when focused
              if (abs(uIndex - uFocusIndex) < 0.1) {
                waveZ = mix(waveZ, 0.0, uFlattenProgress);
                worldPos.z += uFlattenProgress * 4.0;
              }

              worldPos.z += domeZ + waveZ + 0.12;
              gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
          `,
          fragmentShader: `
            uniform sampler2D uTexture;
            varying vec2 vUv;

            void main() {
              vec4 tex = texture2D(uTexture, vUv);

              // Borderless: smooth feathered edge fade
              float edge = smoothstep(0.0, 0.045, vUv.x) * smoothstep(1.0, 0.955, vUv.x) *
                           smoothstep(0.0, 0.045, vUv.y) * smoothstep(1.0, 0.955, vUv.y);

              // Smooth ethereal white light gradient radiating from top-right and bottom-left corners
              float light1 = smoothstep(0.55, 0.0, distance(vUv, vec2(1.0, 1.0))) * 0.70;
              float light2 = smoothstep(0.35, 0.0, distance(vUv, vec2(0.0, 0.0))) * 0.40;
              float totalLight = light1 + light2;

              // Blend image with the soft corner lighting
              vec3 col = tex.rgb + vec3(1.0) * totalLight;
              float alpha = clamp(edge * (0.92 + totalLight * 0.45), 0.0, 1.0);

              gl_FragColor = vec4(col, alpha);
            }
          `,
          transparent: true,
          alphaTest: 0.01,
          side: THREE.DoubleSide
        });

        const cardMesh = new THREE.Mesh(cardGeo, cardMat);
        cardMesh.position.set(pos.x, pos.y, 0);
        if (pos.rot) cardMesh.rotation.z = pos.rot;
        cardMesh.userData = {
          index,
          x: pos.x,
          y: pos.y,
          scale: pos.scale,
          item,
          baseRotZ: pos.rot || 0,
          targetRotX: 0,
          targetRotY: 0
        };
        cardGroup.add(cardMesh);
        interactiveObjects.push(cardMesh);
        cardMeshList.push(cardMesh);

        // Subtitle Mesh - Elevated higher on Z so waves never clip it
        const textH = 1.35 * pos.scale;
        const textGeo = new THREE.PlaneGeometry(baseW * 1.3, textH, 24, 8);
        const textTex = makeTextTexture(item.title || "Skebob", item.description || "");

        const textMat = new THREE.ShaderMaterial({
          uniforms: {
            ...uniforms,
            uTexture: { value: textTex },
            uIndex: { value: index }
          },
          vertexShader: `
            ${sphereDomeGLSL}
            uniform float uIndex;
            uniform float uFocusIndex;
            uniform float uFlattenProgress;
            varying vec2 vUv;

            void main() {
              vUv = uv;
              vec3 pos = position;
              vec4 worldPos = modelMatrix * vec4(pos, 1.0);

              float domeZ = getDome(worldPos.xy);
              float waveZ = getWave(worldPos.xy);

              if (abs(uIndex - uFocusIndex) < 0.1) {
                waveZ = mix(waveZ, 0.0, uFlattenProgress);
                worldPos.z += uFlattenProgress * 4.0;
              }

              // Extra Z elevation (+0.35) ensures typography remains clear and crisp
              worldPos.z += domeZ + waveZ + 0.35;
              gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
          `,
          fragmentShader: `
            uniform sampler2D uTexture;
            varying vec2 vUv;
            void main() {
              gl_FragColor = texture2D(uTexture, vUv);
            }
          `,
          transparent: true,
          side: THREE.DoubleSide
        });

        const textMesh = new THREE.Mesh(textGeo, textMat);
        const yOffset = -(baseH * 0.5 + textH * 0.65);
        textMesh.position.set(pos.x, pos.y + yOffset, 0);
        if (pos.rot) textMesh.rotation.z = pos.rot;
        textMesh.userData = { index, x: pos.x, y: pos.y, scale: pos.scale, item };
        cardGroup.add(textMesh);
        interactiveObjects.push(textMesh);

        cardData.push({ x: pos.x, y: pos.y, scale: pos.scale });
      });
    }

    // --- 5. Controls, Keyboard Flight & Interactive Rig ---
    let isDragging = false;
    let dragStartPos = { x: 0, y: 0 };
    let prevPointer = { x: 0, y: 0 };
    let targetPan = { x: 0, y: 0 };
    let panOffset = { x: 0, y: 0 };
    
    let targetZoom = 32.0;
    let zoom = 32.0;
    let initialPinchDist = null;

    let focusedIndex = -1;
    let focusProgress = 0.0;
    const backBtn = document.getElementById('backBtn');

    // Raycast ground plane for cursor wave reaction
    const groundPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const groundRaycaster = new THREE.Raycaster();
    const groundHit = new THREE.Vector3();
    const pointer = new THREE.Vector2(-999, -999);
    let hoveredCard = null;

    // Keyboard Flight Controls State
    const keysDown = {};
    let isSprinting = false;

    window.addEventListener('keydown', (e) => {
      keysDown[e.code] = true;
      if (e.shiftKey) isSprinting = true;

      // Quick-Cycle Carousel in Focus Mode
      if (focusedIndex !== -1 && cardData.length > 0) {
        if (e.code === 'KeyD' || e.code === 'ArrowRight') {
          focusOnIndex((focusedIndex + 1) % cardData.length);
        } else if (e.code === 'KeyA' || e.code === 'ArrowLeft') {
          focusOnIndex((focusedIndex - 1 + cardData.length) % cardData.length);
        }
      }

      if (e.key === 'Escape') unfocus();
    });

    window.addEventListener('keyup', (e) => {
      keysDown[e.code] = false;
      if (!e.shiftKey) isSprinting = false;
    });

    // Mouse & Cursor Wave Disturbance
    window.addEventListener('mousemove', (e) => {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;

      groundRaycaster.setFromCamera(pointer, camera);
      if (groundRaycaster.ray.intersectPlane(groundPlane, groundHit)) {
        uniforms.uMouseWorld.value.set(groundHit.x, groundHit.y);
        uniforms.uMouseStrength.value = 1.0;
      }

      if (isDragging) {
        const dx = (e.clientX - prevPointer.x) * 0.04;
        const dy = (e.clientY - prevPointer.y) * 0.04;
        targetPan.x -= dx;
        targetPan.y += dy;
        prevPointer = { x: e.clientX, y: e.clientY };
      }

      // Magnetic Card Parallax Tilt on Hover
      if (!isDragging && focusedIndex === -1) {
        const cardHits = groundRaycaster.intersectObjects(cardMeshList);
        if (cardHits.length > 0) {
          const hitMesh = cardHits[0].object;
          hoveredCard = hitMesh;
          const localHit = hitMesh.worldToLocal(cardHits[0].point.clone());
          hitMesh.userData.targetRotY = (localHit.x / (hitMesh.geometry.parameters.width * 0.5)) * 0.28;
          hitMesh.userData.targetRotX = -(localHit.y / (hitMesh.geometry.parameters.height * 0.5)) * 0.28;
        } else if (hoveredCard) {
          hoveredCard.userData.targetRotX = 0;
          hoveredCard.userData.targetRotY = 0;
          hoveredCard = null;
        }
      }
    });

    window.addEventListener('mouseleave', () => {
      uniforms.uMouseStrength.value = 0.0;
    });

    window.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragStartPos = { x: e.clientX, y: e.clientY };
      prevPointer = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // Desktop Wheel Zoom
    window.addEventListener('wheel', (e) => {
      if (focusedIndex !== -1 && e.deltaY > 20) {
        unfocus();
        return;
      }
      targetZoom += e.deltaY * 0.025;
      targetZoom = Math.min(Math.max(targetZoom, 12.0), 65.0);
    });

    // Mobile Touch Events
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        dragStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        prevPointer = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isDragging) {
        const dx = (e.touches[0].clientX - prevPointer.x) * 0.045;
        const dy = (e.touches[0].clientY - prevPointer.y) * 0.045;
        targetPan.x -= dx;
        targetPan.y += dy;
        prevPointer = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2 && initialPinchDist) {
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const diff = initialPinchDist - currentDist;

        if (focusedIndex !== -1 && diff > 25) {
          unfocus();
          initialPinchDist = currentDist;
          return;
        }

        targetZoom += diff * 0.06;
        targetZoom = Math.min(Math.max(targetZoom, 12.0), 65.0);
        initialPinchDist = currentDist;
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        isDragging = false;
        initialPinchDist = null;
      }
    });

    // Raycasting & Tap to Snap
    const clickRaycaster = new THREE.Raycaster();
    function handleTap(clientX, clientY) {
      pointer.x = (clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(clientY / window.innerHeight) * 2 + 1;
      clickRaycaster.setFromCamera(pointer, camera);

      const intersects = clickRaycaster.intersectObjects(interactiveObjects);
      if (intersects.length > 0) {
        focusOnIndex(intersects[0].object.userData.index);
      } else if (focusedIndex !== -1) {
        unfocus();
      }
    }

    window.addEventListener('click', (e) => {
      if (Math.hypot(e.clientX - dragStartPos.x, e.clientY - dragStartPos.y) < 6) {
        handleTap(e.clientX, e.clientY);
      }
    });

    function focusOnIndex(index) {
      focusedIndex = index;
      uniforms.uFocusIndex.value = index;
      backBtn.classList.add('visible');
    }

    function unfocus() {
      if (focusedIndex === -1) return;
      focusedIndex = -1;
      backBtn.classList.remove('visible');
    }

    backBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      unfocus();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 6. Main Render Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();
      uniforms.uTime.value = elapsedTime;

      // WASD / Arrow Keys Flight
      if (focusedIndex === -1) {
        const flySpeed = (isSprinting ? 1.3 : 0.55);
        if (keysDown['KeyW'] || keysDown['ArrowUp']) targetPan.y += flySpeed;
        if (keysDown['KeyS'] || keysDown['ArrowDown']) targetPan.y -= flySpeed;
        if (keysDown['KeyA'] || keysDown['ArrowLeft']) targetPan.x -= flySpeed;
        if (keysDown['KeyD'] || keysDown['ArrowRight']) targetPan.x += flySpeed;
      }

      // Smooth pan and zoom damping
      panOffset.x += (targetPan.x - panOffset.x) * 0.08;
      panOffset.y += (targetPan.y - panOffset.y) * 0.08;
      zoom += (targetZoom - zoom) * 0.08;

      // Hyperspace Warp FOV Expansion on Shift
      const targetFOV = isSprinting ? 64 : 55;
      camera.fov += (targetFOV - camera.fov) * 0.08;
      camera.updateProjectionMatrix();
      particleUniforms.uSpeedWarp.value += ((isSprinting ? 1.0 : 0.0) - particleUniforms.uSpeedWarp.value) * 0.08;

      // Magnetic Card Tilt Smoothing
      cardMeshList.forEach(mesh => {
        const tx = (focusedIndex === mesh.userData.index) ? 0 : (mesh.userData.targetRotX || 0);
        const ty = (focusedIndex === mesh.userData.index) ? 0 : (mesh.userData.targetRotY || 0);
        mesh.rotation.x += (tx - mesh.rotation.x) * 0.1;
        mesh.rotation.y += (ty - mesh.rotation.y) * 0.1;
      });

      if (focusedIndex !== -1) {
        // Curved Dome Snapping & Forward Elevation (+4.0)
        focusProgress += (1.0 - focusProgress) * 0.08;
        const target = cardData[focusedIndex];
        const focusDist = (target.scale > 1.8) ? 14.5 : 8.8;
        const targetDomeZ = getDomeZ(target.x, target.y);
        const elevatedZ = targetDomeZ + 4.0;

        camera.position.x += (target.x - camera.position.x) * 0.08;
        camera.position.y += ((target.y - 1.2) - camera.position.y) * 0.08;
        camera.position.z += ((elevatedZ + focusDist) - camera.position.z) * 0.08;
        camera.lookAt(target.x, target.y - 1.2, elevatedZ);
      } else {
        // IMAX Dome Viewport (Wraps around peripheral vision)
        focusProgress += (0.0 - focusProgress) * 0.08;

        const domeBaseZ = getDomeZ(panOffset.x, panOffset.y);
        const defaultCamX = panOffset.x;
        const defaultCamY = panOffset.y - (zoom * 0.22);
        const defaultCamZ = domeBaseZ + (zoom * 0.95);

        camera.position.x += (defaultCamX - camera.position.x) * 0.08;
        camera.position.y += (defaultCamY - camera.position.y) * 0.08;
        camera.position.z += (defaultCamZ - camera.position.z) * 0.08;
        camera.lookAt(panOffset.x, panOffset.y + (zoom * 0.08), domeBaseZ);

        if (focusProgress < 0.01) {
          uniforms.uFocusIndex.value = -1.0;
        }
      }

      uniforms.uFlattenProgress.value = focusProgress;
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
